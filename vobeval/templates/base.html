<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VOB Field Eval{% endblock %} · VOB Field Eval</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        VOB Field Eval
      </a>
      <nav class="nav">
        <a href="/" class="{{ 'active' if page == 'scorecard' }}">Scorecard</a>
        <a href="/threshold" class="{{ 'active' if page == 'threshold' }}">Threshold</a>
        <a href="/queue" class="{{ 'active' if page == 'queue' }}">Review queue</a>
        <a href="/ab" class="{{ 'active' if page == 'ab' }}">A/B test</a>
      </nav>
      <span class="data-badge" title="All payers, members and documents are generated by scripts/generate_data.py">Synthetic data</span>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap footer">
    Independent prototype built from public information and synthetic data. Not affiliated with Solum Health.
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
