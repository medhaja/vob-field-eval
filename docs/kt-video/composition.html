<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vob-field-eval · KT video</title>
<style>
  :root {
    --bg: #0e131b; --panel: #151c27; --panel2: #1a2230; --line: #2a3546; --line2: #3a475a;
    --text: #e8edf4; --muted: #8e9aac; --dim: #5d6879;
    --blue: #5aa9ff;   /* data / request */
    --violet: #a98bfa; /* stored state: SQLite, gold labels */
    --amber: #f2b54a;  /* low confidence / review */
    --red: #f0646f;    /* failed rule / regression */
    --green: #4cc38a;  /* correct / auto-approved */
    --display: "Segoe UI Semibold", "Segoe UI", system-ui, sans-serif;
    --body: "Segoe UI", system-ui, sans-serif;
    --mono: Consolas, "Cascadia Mono", "Courier New", monospace;
  }
  html, body { margin: 0; background: #07090d; }
  body.render { overflow: hidden; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--text);
    font-family: var(--body); background: radial-gradient(1400px 900px at 30% 20%, #131a25 0%, var(--bg) 60%, #0b0f15 100%);
    transform-origin: 0 0;
  }
  .scene { position: absolute; inset: 0; display: none; }
  .abs { position: absolute; white-space: nowrap; }
  .chapter { left: 80px; top: 50px; font: 22px var(--mono); color: var(--muted); letter-spacing: .02em; }
  .chapter b { color: var(--text); font-weight: 400; }
  .title { left: 80px; top: 92px; font: 600 50px/1.15 var(--display); color: var(--text); }
  .box { position: absolute; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; box-sizing: border-box; }
  .kicker { font: 17px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .chip { position: absolute; box-sizing: border-box; border: 2px solid var(--line2); border-radius: 999px; padding: 8px 20px; font: 22px var(--body); white-space: nowrap; background: var(--panel); }
  .code { position: absolute; background: #10161f; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; box-sizing: border-box; }
  .code .path { height: 48px; line-height: 48px; padding: 0 22px; font: 19px var(--mono); color: var(--muted); border-bottom: 2px solid var(--line); background: #131a24; }
  .code .ln { position: relative; white-space: pre; font-family: var(--mono); padding-left: 84px; padding-right: 20px; }
  .code .ln .no { position: absolute; left: 0; width: 62px; text-align: right; color: var(--dim); }
  .code .ln .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
  .tk-kw { color: #c9d4ff; font-weight: bold; } .tk-str { color: #b9c7d9; font-style: italic; }
  .tk-com { color: #6b7789; } .tk-num { color: #d7dee9; } .tk-def { color: #ffffff; }
  .doc { position: absolute; background: #f3f1ea0d; border: 2px solid var(--line); border-radius: 14px; box-sizing: border-box; }
  .doc .dl { white-space: pre; font: 19px/34px var(--mono); color: #c6cfdb; }
  .mark { border-radius: 4px; padding: 1px 0; }
  .row { position: absolute; box-sizing: border-box; }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }
  #controls { display: none; }
  body.preview #controls { display: flex; gap: 14px; align-items: center; padding: 10px 16px; font: 14px var(--body); color: #cfd6e0; background: #10141b; }
  body.preview #controls input[type=range] { flex: 1; }
  body.preview #wrap { overflow: hidden; }
  #err { position: absolute; left: 20px; bottom: 20px; color: #fff; background: #b00020; font: 18px var(--mono); padding: 8px 12px; display: none; z-index: 99; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="err"></div></div></div>
<div id="controls">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
  <span id="clock">0.00 s</span>
  <span id="scene"></span>
</div>
<script>
"use strict";
/* Deterministic composition: window.renderAt(t) sets every animated property from t alone.
   No CSS transitions, no requestAnimationFrame timing (except the preview player), no randomness. */

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const prog = (t, start, dur = 0.6) => ease((t - start) / dur);
const lerp = (a, b, p) => a + (b - a) * p;
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function el(tag, cls, html, parent, style) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (style) Object.assign(e.style, style);
  if (parent) parent.appendChild(e);
  return e;
}
function place(e, x, y, w, h) {
  e.style.left = x + "px"; e.style.top = y + "px";
  if (w != null) e.style.width = w + "px";
  if (h != null) e.style.height = h + "px";
  return e;
}
// Fade + slide in at `start`; optional fade out at `end`.
function show(e, t, start, opts = {}) {
  const { dur = 0.6, dy = 14, dx = 0, end = null, outDur = 0.5, max = 1 } = opts;
  let p = prog(t, start, dur);
  let o = p;
  if (end != null) o *= 1 - prog(t, end, outDur);
  e.style.opacity = (o * max).toFixed(4);
  e.style.transform = `translate(${((1 - p) * dx).toFixed(2)}px, ${((1 - p) * dy).toFixed(2)}px)`;
  return p;
}
function svgEl(tag, attrs, parent) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function mixColor(a, b, p) {
  const h = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const A = h(a), B = h(b);
  return "#" + A.map((v, i) => Math.round(lerp(v, B[i], p)).toString(16).padStart(2, "0")).join("");
}
const C = { blue: "#5aa9ff", violet: "#a98bfa", amber: "#f2b54a", red: "#f0646f", green: "#4cc38a",
            line: "#2a3546", line2: "#3a475a", text: "#e8edf4", muted: "#8e9aac", panel: "#151c27" };
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

// Animated arrow: path drawn with a dash offset; the head appears when the line arrives.
function arrow(svg, d, color, width = 3) {
  const path = svgEl("path", { d, fill: "none", stroke: color, "stroke-width": width, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
  const len = path.getTotalLength();
  path.setAttribute("stroke-dasharray", `${len} ${len}`);
  const end = path.getPointAtLength(len), before = path.getPointAtLength(Math.max(0, len - 4));
  const ang = Math.atan2(end.y - before.y, end.x - before.x);
  const s = 14, pts = [[0, 0], [-s, -s * 0.55], [-s, s * 0.55]].map(([x, y]) =>
    [end.x + x * Math.cos(ang) - y * Math.sin(ang), end.y + x * Math.sin(ang) + y * Math.cos(ang)].join(",")).join(" ");
  const head = svgEl("polygon", { points: pts, fill: color }, svg);
  return (p, alpha = 1) => {
    path.setAttribute("stroke-dashoffset", (len * (1 - p)).toFixed(2));
    path.style.opacity = p > 0 ? alpha : 0;
    head.style.opacity = (clamp((p - 0.92) / 0.08) * alpha).toFixed(3);
  };
}

// Minimal Python highlighter for code-focus panels.
const KW = new Set("def class return if else elif for in not or and None True False is import from as with try except lambda yield".split(" "));
function hiPy(src) {
  const re = /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|f"(?:[^"\\]|\\.)*")|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|(.)/g;
  let out = "", m, prev = "";
  while ((m = re.exec(src))) {
    if (m[1]) out += `<span class="tk-com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="tk-str">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="tk-num">${esc(m[3])}</span>`;
    else if (m[4]) out += KW.has(m[4]) ? `<span class="tk-kw">${m[4]}</span>` : (prev === "def" || prev === "class") ? `<span class="tk-def">${m[4]}</span>` : esc(m[4]);
    else out += esc(m[0]);
    if (m[4]) prev = m[4]; else if (!m[5]) prev = "";
  }
  return out;
}
// Code panel: lines = [[number|null, text], ...]
function codePanel(parent, { x, y, w, path, lines, size = 22, lh = 36 }) {
  const box = place(el("div", "code", null, parent), x, y, w, 48 + 16 + lines.length * lh + 14);
  el("div", "path", esc(path), box);
  const body = el("div", null, null, box, { paddingTop: "14px" });
  const map = {};
  for (const [no, text] of lines) {
    const ln = el("div", "ln", null, body, { fontSize: size + "px", lineHeight: lh + "px", height: lh + "px" });
    el("span", "bar", null, ln);
    el("span", "no", no == null ? "⋮" : String(no), ln);
    el("span", "src", no == null ? "" : hiPy(text), ln);
    if (no != null) map[no] = ln;
  }
  // set(active: {lineNo: [color, strength]}) — strength 0..1; dims others while anything is active.
  box.highlight = (active) => {
    let any = 0;
    for (const k in active) any = Math.max(any, active[k][1]);
    for (const no in map) {
      const a = active[no];
      const s = a ? a[1] : 0;
      const ln = map[no];
      ln.style.background = a ? rgba(a[0], 0.16 * s) : "transparent";
      ln.querySelector(".bar").style.background = a ? rgba(a[0], s) : "transparent";
      ln.style.opacity = (1 - any * 0.55 * (1 - s)).toFixed(3);
    }
  };
  box.highlight({});
  return box;
}

// ---------- data + timing ----------
let T = null, D = null;
const SCENE_FNS = [];
const errors = [];
function fail(msg) { errors.push(msg); const e = document.getElementById("err"); e.style.display = "block"; e.textContent = errors.join(" | "); console.error(msg); }

// Beat lookup: the time (scene-local) where `phrase` starts in the narration, from Kokoro word timestamps.
function beatsFor(scene) {
  const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
  let joined = "", owner = [];
  scene.words.forEach((w, i) => { const n = norm(w.text); joined += n; for (let k = 0; k < n.length; k++) owner.push(i); });
  return (phrase, which = "start") => {
    const idx = joined.indexOf(norm(phrase));
    if (idx < 0) { fail(`beat not found in scene ${scene.id}: "${phrase}"`); return 0; }
    const w = scene.words[owner[which === "start" ? idx : idx + norm(phrase).length - 1]];
    return which === "start" ? w.start : w.end;
  };
}

function header(root, no, label, title) {
  el("div", "abs chapter", `<b>${no}</b> / ${esc(label)}`, root);
  return el("div", "abs title", esc(title), root);
}

// ---------- scenes ----------
// Each builder gets (root, S, scene) and returns update(t) where t is scene-local seconds.

// 01 · Why it exists
SCENE_FNS.push((root, S, sc) => {
  const hero = el("div", "abs", null, root, { left: "0", top: "0", width: "1920px", height: "1080px" });
  el("div", "abs", "VOB Field Eval", hero, { left: "0", width: "1920px", top: "380px", textAlign: "center", font: "600 120px var(--display)" });
  el("div", "abs muted", "Field-level accuracy, review routing and prompt A/B for benefits verification", hero, { left: "0", width: "1920px", top: "540px", textAlign: "center", font: "34px var(--body)" });
  el("div", "abs", "A walkthrough of the codebase", hero, { left: "0", width: "1920px", top: "610px", textAlign: "center", font: "24px var(--mono)", color: C.blue });
  const chap = el("div", "abs chapter", "<b>01</b> / Why it exists", root);
  const title = el("div", "abs title", "One case is 68 separate answers", root);

  const bCodes = S("eight C-P-T codes"), bOwn = S("its own copay"), b68 = S("sixty-eight"),
        bGrade = S("Grade the whole case"), b97 = S("ninety-seven percent"), bEvery = S("scores every field");
  const x0 = 150, y0 = 250, cw = 92, ch = 40, stride = 102, labW = 110;
  const grid = el("div", "abs", null, root, { left: "0", top: "0" });
  const cols = ["Copay", "Coins.", "Auth", "Sess/yr", "Units/day", "POS", "Tele", "Notes"];
  const colEls = cols.map((c, i) => el("div", "abs muted", c, grid, { left: x0 + labW + i * stride + "px", top: y0 + 60 + "px", width: cw + "px", textAlign: "center", font: "16px var(--body)" }));
  const planLab = el("div", "abs mono", "plan", grid, { left: x0 + "px", top: y0 + 8 + "px", font: "20px var(--mono)", color: C.muted });
  const planNames = ["Active", "Deductible", "Ded. met", "OOP max"];
  const cells = [];
  planNames.forEach((n, i) => cells.push({ e: place(el("div", "box", `<div style="font:15px var(--body);text-align:center;line-height:${ch - 4}px;color:#cfe3ff">${n}</div>`, grid), x0 + labW + i * stride, y0, cw, ch), r: -1, c: i }));
  const codes = ["97151", "97152", "97153", "97154", "97155", "97156", "97157", "97158"];
  const rowLabs = codes.map((c, r) => el("div", "abs mono", c, grid, { left: x0 + "px", top: y0 + 100 + r * 52 + 8 + "px", font: "20px var(--mono)" }));
  codes.forEach((_, r) => cols.forEach((_, c) => cells.push({ e: place(el("div", "box", null, grid), x0 + labW + c * stride, y0 + 100 + r * 52, cw, ch), r, c })));
  const redSet = new Set(["2,3", "4,5", "0,5", "6,0"]);
  const counter = el("div", "abs", null, root, { left: "1200px", top: "290px" });
  el("div", "mono muted", "4 + 8 × 8", counter, { font: "40px var(--mono)" });
  el("div", null, "= 68 scored fields per case", counter, { font: "600 46px var(--display)", marginTop: "6px" });
  const badge = place(el("div", "box", `<div style="font:600 56px var(--display);color:${C.red}">Case: ✗ wrong</div><div class="muted" style="font:26px var(--body);margin-top:10px">…but which field? which payer?</div>`, root), 330, 470, 560, 170);
  Object.assign(badge.style, { borderColor: C.red, textAlign: "center", paddingTop: "22px", background: "#1a1418" });
  const tile = (y, big, color, txt) => {
    const b = place(el("div", "box", `<div style="font:600 80px var(--display);color:${color}">${big}</div><div style="font:26px var(--body);margin-top:-4px">${txt}</div>`, root), 1200, y, 600, 170);
    Object.assign(b.style, { padding: "18px 30px", borderColor: rgba(color, 0.6) });
    return b;
  };
  const s = D.summary_v1;
  const t1 = tile(470, (100 * s.field_accuracy).toFixed(1) + "%", C.green, "of fields correct · prompt v1");
  const t2 = tile(665, (100 * s.case_accuracy).toFixed(1) + "%", C.amber, "of cases with every field correct");
  const foot = el("div", "abs muted", `${D.n_cases} synthetic cases · deterministic mock extractor`, root, { left: "1200px", top: "860px", font: "20px var(--mono)" });

  return (t) => {
    show(hero, t, -1, { end: bCodes - 0.9, outDur: 0.6, dy: 0 });
    show(chap, t, bCodes - 0.5, { dy: 0 });
    show(title, t, bCodes - 0.5);
    rowLabs.forEach((e, r) => show(e, t, bCodes + r * 0.08, { dx: -10, dy: 0 }));
    show(planLab, t, bOwn, { dx: -10, dy: 0 });
    colEls.forEach((e, i) => show(e, t, bOwn + i * 0.05, { dy: 6 }));
    const redP = prog(t, bGrade, 0.6);
    const dimP = prog(t, bGrade + 1.7, 0.6) * (1 - prog(t, bEvery, 0.7));
    for (const { e, r, c } of cells) {
      const st = r < 0 ? bOwn : bOwn + 0.25 + r * 0.12 + c * 0.03;
      const p = prog(t, st, 0.5);
      const red = redSet.has(`${r},${c}`) ? redP : 0;
      e.style.opacity = (p * (1 - 0.85 * dimP * (red ? 0.6 : 1))).toFixed(3);
      e.style.transform = `translateY(${((1 - p) * 8).toFixed(2)}px)`;
      e.style.background = red ? rgba(C.red, 0.12 + 0.2 * red) : rgba(C.blue, r < 0 ? 0.2 : 0.14);
      e.style.borderColor = red ? mixColor("#4a76a8", C.red, red) : "#4a76a8";
    }
    show(counter, t, b68);
    show(badge, t, bGrade + 1.7, { end: bEvery, dy: 10 });
    show(t1, t, b97);
    show(t2, t, b97 + 0.9);
    show(foot, t, b97 + 1.4);
  };
});

// 02 · Architecture
SCENE_FNS.push((root, S) => {
  header(root, "02", "Architecture", "Write once, compute on read");
  const bGen = S("seeded generator"), bExt = S("An extractor"), bStore = S("stores typed results"), bRead = S("On the read side"),
        bCache = S("cached until"), bLLM = S("optional Lite"), bPlain = S("plain, deterministic");
  const svg = svgEl("svg", { width: 1920, height: 1080 }, root);
  const lane1 = el("div", "abs kicker", "write path · once, at startup", root, { left: "140px", top: "212px" });
  const lane2 = el("div", "abs kicker", "read path · on every page load", root, { left: "140px", top: "500px" });
  const mk = (x, y, w, h, color, kicker, main, sub, tag) => {
    const b = place(el("div", "box", `<div class="kicker">${kicker}</div><div class="mono" style="font-size:30px;margin-top:6px">${main}</div><div class="muted" style="font-size:20px;margin-top:6px">${sub}</div>` + (tag ? `<div class="tag mono" style="font-size:17px;margin-top:8px;color:${C.green}">✓ deterministic · no model</div>` : ""), root), x, y, w, h);
    Object.assign(b.style, { padding: "16px 22px", borderColor: color });
    return b;
  };
  const gen = mk(140, 250, 400, 170, C.blue, "synthetic data", "generator.py", "240 cases · 4 fictional payers<br>seed 20261031");
  const ext = mk(700, 250, 440, 170, C.blue, "extraction", "extractor.py", "prompt v1 + v2 → typed VOBResult<br>deterministic mock by default");
  const db = mk(1300, 250, 460, 170, C.violet, "stored state", "SQLite · store.py", "cases · results · gold_labels");
  const val = mk(140, 650, 330, 150, C.line2, "rules", "validator.py", "12 payer rules", true);
  const rou = mk(560, 650, 330, 150, C.line2, "routing", "router.py", "auto or review · 0.80", true);
  const evl = mk(980, 650, 330, 150, C.line2, "scoring", "evaluation.py", "accuracy · A/B · CIs", true);
  const ui = mk(1400, 650, 360, 150, C.line2, "demo UI", "app.py", "FastAPI · 5 pages");
  const tags = [val, rou, evl].map((b) => b.querySelector(".tag"));
  const a1 = arrow(svg, "M545,335 H692", C.blue), a2 = arrow(svg, "M1145,335 H1292", C.blue);
  const a3 = arrow(svg, "M1530,425 V545 H305 V642", C.violet);
  const a4 = arrow(svg, "M475,725 H552", C.blue), a5 = arrow(svg, "M895,725 H972", C.blue), a6 = arrow(svg, "M1315,725 H1392", C.blue);
  const snap = svgEl("rect", { x: 112, y: 625, width: 1676, height: 238, rx: 18, fill: "none", stroke: C.violet, "stroke-width": 2.5, "stroke-dasharray": "10 8" }, svg);
  const snapLab = el("div", "abs mono", "Snapshot · cached until gold_revision changes  (service.py)", root, { left: "140px", top: "818px", fontSize: "20px", color: C.violet });
  const llm = svgEl("rect", { x: 684, y: 234, width: 472, height: 202, rx: 20, fill: "none", stroke: C.blue, "stroke-width": 2.5, "stroke-dasharray": "6 7" }, svg);
  const llmLab = el("div", "abs mono", "optional: LiteLLM + prompts/v1.md, v2.md · only if LITELLM_MODEL is set", root, { left: "684px", top: "450px", fontSize: "18px", color: C.blue });
  return (t) => {
    show(lane1, t, 0.2, { dy: 0 });
    show(gen, t, bGen - 0.2);
    show(ext, t, bExt - 0.1);
    a1(prog(t, bExt, 0.7));
    show(db, t, bStore - 0.1);
    a2(prog(t, bStore, 0.7));
    show(lane2, t, bRead - 0.3, { dy: 0 });
    a3(prog(t, bRead, 1.0));
    show(val, t, bRead + 0.8); a4(prog(t, bRead + 1.2, 0.5));
    show(rou, t, bRead + 1.4); a5(prog(t, bRead + 1.8, 0.5));
    show(evl, t, bRead + 2.0); a6(prog(t, bRead + 2.4, 0.5));
    show(ui, t, bRead + 2.6);
    const pc = prog(t, bCache, 0.7);
    snap.style.opacity = pc; show(snapLab, t, bCache, { dy: 6 });
    const pl = prog(t, bLLM, 0.7);
    llm.style.opacity = pl; show(llmLab, t, bLLM, { dy: 6 });
    tags.forEach((e, i) => show(e, t, bPlain + i * 0.25, { dy: 4 }));
  };
});

// Shared: render the real synthetic document excerpt with marks.
function docPanel(root, x, y, w, statusColors) {
  const cs = D.case;
  const box = place(el("div", "doc", null, root), x, y, w, 70 + (cs.lines.length + 1) * 34 + 26);
  box.style.padding = "0 24px";
  el("div", "mono muted", `${cs.case_id} · ${esc(cs.payer)} · synthetic document`, box, { font: "18px/52px var(--mono)", borderBottom: "2px solid " + C.line, margin: "0 -24px 10px", padding: "0 24px" });
  el("div", "dl", esc(cs.header), box, { color: "#e3e8ef" });
  const marks = {};
  for (const ln of cs.lines) {
    let html = "", pos = 0;
    for (const m of ln.marks) {
      html += esc(ln.text.slice(pos, m.start));
      html += `<span class="mark" data-key="${m.key}">${esc(ln.text.slice(m.start, m.end))}</span>`;
      pos = m.end;
    }
    html += esc(ln.text.slice(pos));
    const d = el("div", "dl", html, box);

// 06 · Eval & A/B

// ---------- driver ----------
const scenes = [];
function build() {
  const stage = document.getElementById("stage");
  T.scenes.forEach((sc, i) => {
    const root = el("div", "scene", null, stage);
    root.style.display = "block";  // layout needed for SVG path lengths during build
    const update = SCENE_FNS[i](root, beatsFor(sc), sc);
    root.style.display = "none";
    scenes.push({ sc, root, update, last: i === T.scenes.length - 1 });
  });
}
window.renderAt = function renderAt(t) {
  t = clamp(t, 0, T.total);
  let idx = scenes.findIndex((s) => t >= s.sc.start && t < s.sc.start + s.sc.duration);
  if (idx < 0) idx = scenes.length - 1;
  scenes.forEach((s, i) => {
    if (i !== idx) { s.root.style.display = "none"; return; }
    const lt = t - s.sc.start;
    s.root.style.display = "block";
    const fadeIn = i === 0 ? 1 : prog(lt, 0, 0.35);
    const fadeOut = s.last ? 1 : 1 - prog(lt, s.sc.duration - 0.3, 0.3);
    s.root.style.opacity = (fadeIn * fadeOut).toFixed(4);
    s.update(lt);
  });
  return idx;
};
window.ready = (async () => {
  [T, D] = await Promise.all(["timing.json", "scene_data.json"].map((f) => fetch(f).then((r) => r.json())));
  await document.fonts.ready;
  build();
  window.TOTAL = T.total;
  window.renderAt(0);
  if (errors.length) throw new Error(errors.join("; "));
  return { total: T.total, fps: T.fps, scenes: T.scenes.map((s) => ({ id: s.id, title: s.title, start: s.start, duration: s.duration })) };
})();

// ---------- preview mode (?preview): play/scrub; not used by the renderer ----------
if (new URLSearchParams(location.search).has("preview")) {
  document.body.classList.add("preview");
  window.ready.then(() => {
    const stage = document.getElementById("stage"), wrap = document.getElementById("wrap");
    const fit = () => { const s = Math.min(innerWidth / 1920, (innerHeight - 50) / 1080); stage.style.transform = `scale(${s})`; wrap.style.height = 1080 * s + "px"; };
    fit(); addEventListener("resize", fit);
    const scrub = document.getElementById("scrub"), clock = document.getElementById("clock"), name = document.getElementById("scene"), btn = document.getElementById("play");
    scrub.max = T.total;
    const audio = new Audio("out/narration.wav");
    let playing = false, t0 = 0, tStart = 0;
    const draw = (t) => { const i = renderAt(t); scrub.value = t; clock.textContent = t.toFixed(2) + " s"; name.textContent = T.scenes[i].id + " · " + T.scenes[i].title; };
    const tick = () => { if (!playing) return; const t = tStart + (performance.now() - t0) / 1000; if (t >= T.total) { playing = false; btn.textContent = "Play"; } draw(Math.min(t, T.total)); requestAnimationFrame(tick); };
    btn.onclick = () => { playing = !playing; btn.textContent = playing ? "Pause" : "Play"; if (playing) { tStart = +scrub.value; t0 = performance.now(); audio.currentTime = tStart; audio.play().catch(() => {}); tick(); } else audio.pause(); };
    scrub.oninput = () => { playing = false; btn.textContent = "Play"; audio.pause(); draw(+scrub.value); };
    const q = new URLSearchParams(location.search).get("t"); if (q) draw(+q);
  });
} else {
  document.body.classList.add("render");
}
